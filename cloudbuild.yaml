# ==============================================================================
# Cloud Build による CI/CD 用の構成
#
#   手動実行:
#     gcloud builds submit --config=cloudbuild.yaml \
#       --substitutions=_REGION=asia-northeast1,_SERVICE_NAME=aics-catalog-enricher
#
#   GitHub 連携 (Cloud Build トリガー) を設定すると push ごとに自動デプロイされます。
#   ※ Cloud Build のサービスアカウントに roles/run.admin と roles/iam.serviceAccountUser
#      が必要です（deploy_cloudrun.sh の手順 2 を参照）。
# ==============================================================================
substitutions:
  _REGION: asia-northeast1
  _SERVICE_NAME: aics-catalog-enricher
  _REPOSITORY: aics-enricher
  _RUNTIME_SA: aics-enricher-sa
  _VERTEX_LOCATION: global
  _DEFAULT_MODEL: gemini-3.8-flash
  _DEFAULT_DATASET: retail_search
  _DEFAULT_TABLE: d-vais-c

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest'

steps:
  # --- 1) Artifact Registry リポジトリを用意（未作成なら作成） -------------------
  - id: 'ensure-artifact-registry'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: bash
    args:
      - -c
      - |
        gcloud artifacts repositories describe "${_REPOSITORY}" \
          --location="${_REGION}" --project="${PROJECT_ID}" >/dev/null 2>&1 \
        || gcloud artifacts repositories create "${_REPOSITORY}" \
             --repository-format=docker \
             --location="${_REGION}" \
             --project="${PROJECT_ID}" \
             --description="AI Commerce Search Catalog Enricher images"

  # --- 2) コンテナイメージのビルド ----------------------------------------------
  - id: 'build'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest'
      - '.'

  # --- 3) Artifact Registry へ push ---------------------------------------------
  - id: 'push'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}'

  # --- 4) Cloud Run へデプロイ ----------------------------------------------------
  #  --max-instances=1     : 状態をプロセス内メモリに保持するため必須
  #  --no-cpu-throttling   : バッチ Enrichment のバックグラウンド処理を止めないため
  - id: 'deploy'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--service-account=${_RUNTIME_SA}@${PROJECT_ID}.iam.gserviceaccount.com'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--timeout=3600'
      - '--concurrency=40'
      - '--min-instances=0'
      - '--max-instances=1'
      - '--no-cpu-throttling'
      - '--execution-environment=gen2'
      - '--set-env-vars=PROJECT_ID=${PROJECT_ID},LOCATION=${_VERTEX_LOCATION},DEFAULT_MODEL=${_DEFAULT_MODEL},DEFAULT_DATASET=${_DEFAULT_DATASET},DEFAULT_TABLE=${_DEFAULT_TABLE}'
      - '--no-allow-unauthenticated'

timeout: 1800s
